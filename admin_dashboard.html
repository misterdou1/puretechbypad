<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pure Tech Admin | Dashboard</title>
    <link rel="stylesheet" href="css/puretechstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .admin-container { max-width: 1100px; margin: 2rem auto; padding: 0 20px; }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: white; padding: 1rem 2rem; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-logout { background: #ff4d4d; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

        .grid-admin { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }

        /* Formulaire */
        .add-product-card { background: white; padding: 1.5rem; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); height: fit-content; }
        .add-product-card h3 { margin-top: 0; margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-save { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem; }

        /* Tableau */
        .products-card { background: white; padding: 1.5rem; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #fafafa; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .img-thumb { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header-admin">
            <h2><i class="fas fa-tachometer-alt"></i> Tableau de Bord Admin</h2>
            <button class="btn-logout" onclick="logout()">Déconnexion</button>
        </div>

        <div class="grid-admin">
            <!-- Formulaire d'ajout -->
            <div class="add-product-card">
                <h3>Ajouter un Produit</h3>
                <div class="form-group">
                    <label>Nom du produit</label>
                    <input type="text" id="name" placeholder="ex: iPhone 16 Pro">
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <select id="category">
                        <option value="smartphone">Smartphone</option>
                        <option value="audio">Audio</option>
                        <option value="accessoire">Accessoire</option>
                        <option value="tablette">Tablette</option>
                        <option value="googlepixel">Google Pixel</option>
                        <option value="ordinateur">Ordinateur</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Prix (FCFA)</label>
                    <input type="number" id="price" placeholder="ex: 450000">
                </div>
                <div class="form-group">
                    <label>Image (chemin local)</label>
                    <input type="text" id="img" placeholder="images/iphone16.jpg">
                </div>
                <button class="btn-save" onclick="addProduct()">Enregistrer le produit</button>
            </div>

            <!-- Liste des produits -->
            <div class="products-card">
                <h3>Inventaire Actuel</h3>
                <table>
                    <thead>
                        <tr>
                            <th>Img</th>
                            <th>Nom</th>
                            <th>Catégorie</th>
                            <th>Prix</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-list">
                        <!-- Rempli par JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const TOKEN = localStorage.getItem('adminToken');

        if (!TOKEN) {
            window.location.href = 'admin_login.html';
        }

        async function fetchProducts() {
            try {
                const response = await fetch('http://localhost:5000/api/products');
                const products = await response.json();
                const list = document.getElementById('admin-product-list');
                list.innerHTML = products.map(p => `
                    <tr>
                        <td><img src="${p.img}" class="img-thumb"></td>
                        <td>${p.name}</td>
                        <td>${p.category}</td>
                        <td>${p.price.toLocaleString()} F</td>
                        <td><button class="btn-delete" onclick="deleteProduct(${p.id})">Supprimer</button></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Erreur chargement produits admin');
            }
        }

        async function addProduct() {
            const product = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: Number(document.getElementById('price').value),
                img: document.getElementById('img').value
            };

            try {
                const response = await fetch('http://localhost:5000/api/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${TOKEN}`
                    },
                    body: JSON.stringify(product)
                });

                if (response.ok) {
                    alert('Produit ajouté !');
                    location.reload();
                } else {
                    alert('Erreur lors de l\'ajout. Vérifiez vos données.');
                }
            } catch (err) {
                alert('Erreur serveur');
            }
        }

        async function deleteProduct(id) {
            if (!confirm('Supprimer ce produit ?')) return;

            try {
                const response = await fetch(`http://localhost:5000/api/products/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${TOKEN}` }
                });

                if (response.ok) {
                    fetchProducts();
                } else {
                    alert('Erreur de suppression');
                }
            } catch (err) {
                alert('Erreur serveur');
            }
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = 'admin_login.html';
        }

        fetchProducts();
    </script>
</body>
</html>
