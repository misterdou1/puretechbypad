<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Pure Tech by PAD</title>
    <link rel="stylesheet" href="css/puretechstyle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --admin-bg: #f4f7f6;
            --sidebar-width: 250px;
        }
        body { background-color: var(--admin-bg); display: flex; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { width: var(--sidebar-width); height: 100vh; background: #2c3e50; color: white; position: fixed; padding: 20px; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; color: #3498db; }
        .sidebar nav a { display: block; color: white; text-decoration: none; padding: 15px; margin-bottom: 10px; border-radius: 5px; transition: 0.3s; }
        .sidebar nav a:hover { background: #34495e; }
        .main-content { margin-left: var(--sidebar-width); padding: 30px; width: calc(100% - var(--sidebar-width)); }
        .header-admin { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #333; }
        .btn-add { background: #2ecc71; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-edit { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 30px; border-radius: 10px; width: 400px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-save { background: #2ecc71; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Pure Tech Admin</h2>
        <nav>
            <a href="#"><i class="fas fa-box"></i> Produits</a>
            <a href="#"><i class="fas fa-chart-line"></i> Statistiques</a>
            <a href="index.html"><i class="fas fa-external-link-alt"></i> Voir le Site</a>
            <a href="#" onclick="logout()" style="margin-top: 50px; color: #e74c3c;"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
        </nav>
    </div>

    <div class="main-content">
        <div class="header-admin">
            <h1>Gestion des Produits</h1>
            <button class="btn-add" onclick="openModal()"><i class="fas fa-plus"></i> Ajouter un Produit</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Image</th>
                        <th>Nom</th>
                        <th>Catégorie</th>
                        <th>Prix (FCFA)</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="admin-product-list">
                    <!-- Chargé par JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Produit -->
    <div id="product-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Ajouter un Produit</h2>
            <form id="product-form">
                <input type="hidden" id="prod-id">
                <div class="form-group">
                    <label>Nom du produit</label>
                    <input type="text" id="prod-name" required>
                </div>
                <div class="form-group">
                    <label>Catégorie</label>
                    <select id="prod-category">
                        <option value="smartphone">Smartphone</option>
                        <option value="audio">Audio</option>
                        <option value="accessoire">Accessoire</option>
                        <option value="tablette">Tablette</option>
                        <option value="googlepixel">Google Pixel</option>
                        <option value="ordinateur">Ordinateur</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Prix (FCFA)</label>
                    <input type="number" id="prod-price" required>
                </div>
                <div class="form-group">
                    <label>Chemin de l'image (ex: images/iphone15.jpg)</label>
                    <input type="text" id="prod-img" required>
                </div>
                <button type="submit" class="btn-save">Enregistrer</button>
                <button type="button" onclick="closeModal()" style="background:none; border:none; color:gray; cursor:pointer; width:100%; margin-top:10px;">Annuler</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api/products';

        async function fetchProducts() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const list = document.getElementById('admin-product-list');
            list.innerHTML = data.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td><img src="${p.img}" width="40" height="40" style="object-fit:cover; border-radius:5px;"></td>
                    <td>${p.name}</td>
                    <td>${p.category}</td>
                    <td>${p.price.toLocaleString()}</td>
                    <td>
                        <button class="btn-edit" onclick="editProduct(${p.id})"><i class="fas fa-edit"></i></button>
                        <button class="btn-delete" onclick="deleteProduct(${p.id})"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function openModal(id = null) {
            const modal = document.getElementById('product-modal');
            const form = document.getElementById('product-form');
            form.reset();
            document.getElementById('prod-id').value = '';
            document.getElementById('modal-title').innerText = 'Ajouter un Produit';

            if (id) {
                fetch(API_URL).then(res => res.json()).then(products => {
                    const p = products.find(prod => prod.id === id);
                    document.getElementById('prod-id').value = p.id;
                    document.getElementById('prod-name').value = p.name;
                    document.getElementById('prod-category').value = p.category;
                    document.getElementById('prod-price').value = p.price;
                    document.getElementById('prod-img').value = p.img;
                    document.getElementById('modal-title').innerText = 'Modifier le Produit';
                });
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('product-modal').style.display = 'none';
        }

        document.getElementById('product-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            const product = {
                name: document.getElementById('prod-name').value,
                category: document.getElementById('prod-category').value,
                price: parseInt(document.getElementById('prod-price').value),
                img: document.getElementById('prod-img').value
            };

            if (id) {
                await fetch(`${API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(product)
                });
            } else {
                await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(product)
                });
            }
            closeModal();
            fetchProducts();
        };

        async function deleteProduct(id) {
            if (confirm('Supprimer ce produit ?')) {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchProducts();
            }
        }

        function editProduct(id) {
            openModal(id);
        }

        function logout() {
            window.location.href = 'admin_login.html';
        }

        fetchProducts();
    </script>
</body>
</html>
